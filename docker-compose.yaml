# Démarrage :      docker compose up -d server ollama ollama-pull open-webui
# Lancer tests :   docker compose run --rm test
# Une app démo :   docker compose run --rm --service-ports breed-advisor
#
# Les clés API sont lues depuis .env (voir .env.example).

x-app: &app
  build: .
  volumes:
    - .:/app
  env_file:
    - path: .env
      required: false
  environment:
    OLLAMA_HOST: http://ollama:11434
    SERVER_URL: http://server:8000

services:
  # Backend FastAPI : toutes les routes des steps/ (doc interactive sur http://localhost:8000)
  server:
    <<: *app
    command: python server.py
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000\", timeout=2).raise_for_status()'"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Runner de tests : exécute les steps dans l'ordre, s'arrête au premier échec
  test:
    <<: *app
    command: python tests.py
    profiles: ["test"]
    depends_on:
      server:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  # Serveur de modèles LLM locaux
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama/ollama:/root/.ollama
    restart: unless-stopped

  # Télécharge une fois les modèles locaux définis dans .env, puis s'arrête
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${OLLAMA_SMALL_MODEL:-llama3.2:1b}"
        ollama pull "$${OLLAMA_MEDIUM_MODEL:-llama3.2:3b}"
    restart: "no"

  # Interface type ChatGPT pour tester les modèles locaux à la main (http://localhost:3000)
  # (remplace l'ancienne image ollama-webui, renommée Open WebUI)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    volumes:
      - ./ollama/open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    restart: unless-stopped

  # ---------- Apps de démo (lancer une à la fois, profil "apps") ----------
  gradio-hello-world:
    <<: *app
    command: python demos/gradio-hello-world.py
    profiles: ["apps"]
    ports:
      - "7860:7860"

  streamlit-hello-world:
    <<: *app
    command: streamlit run demos/streamlit-hello-world.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"

  breed-advisor:            # step 3
    <<: *app
    command: python demos/breed_advisor.py
    profiles: ["apps"]
    ports:
      - "7860:7860"
    depends_on:
      server:
        condition: service_healthy

  schedule:                 # step 5
    <<: *app
    command: streamlit run demos/step5_schedule.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"

  breed-recognition:        # step 6
    <<: *app
    command: streamlit run demos/breed_recognition.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"
    depends_on:
      server:
        condition: service_healthy

  schedule-bis:             # step 5 bis (Claude)
    <<: *app
    command: streamlit run demos/step5_schedule_bis.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"

  generation:               # step 8
    <<: *app
    command: streamlit run demos/step8_generation.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"
    depends_on:
      - ollama

  generation-bis:           # step 8 bis (Claude)
    <<: *app
    command: streamlit run demos/step8_generation_bis.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"

  comments-review:          # step 9 / 10 (human in the loop)
    <<: *app
    command: streamlit run demos/comments-human-in-the-loop.py --server.address 0.0.0.0
    profiles: ["apps"]
    ports:
      - "8501:8501"
